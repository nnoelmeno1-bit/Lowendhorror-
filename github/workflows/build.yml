
name: Build LowEndHorror

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Minecraft mod
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          elif [ -f build.gradle ]; then
            gradle build
          else
            echo "Nem található a build.gradle fájl."
            exit 1
          fi

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LowEndHorror-JAR
          path: build/libs/*.jar
          
